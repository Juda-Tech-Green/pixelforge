name: Verify
on: [push, pull_request]
jobs:
  clean-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:release
      - run: node scripts/verify-release.mjs
      - run: npm run test:skill
      - run: npm run test:external
        if: matrix.os != 'macos-latest'
        env:
          PIXELFORGE_CHROME: ${{ matrix.os == 'windows-latest' && 'C:/Program Files/Google/Chrome/Application/chrome.exe' || '/usr/bin/google-chrome' }}
      - run: npm run test:engines
        if: matrix.os != 'macos-latest'
        env:
          PIXELFORGE_CHROME: ${{ matrix.os == 'windows-latest' && 'C:/Program Files/Google/Chrome/Application/chrome.exe' || '/usr/bin/google-chrome' }}
